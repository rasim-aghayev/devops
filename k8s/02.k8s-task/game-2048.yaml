apiVersion: apps/v1
kind: Deployment
metadata:
  name: game
  labels:
    app: game
spec:
  replicas: 1
  selector:
    matchLabels:
      app: game
  template:
    metadata:
      labels:
        app: game
    spec:
      containers:
      - name: game
        image: marcincuber/2048-game
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: svc-2048
spec:
  type: ClusterIP
  selector:
    app: game
  ports:
  - port: 8080
    targetPort: 80
    protocol: TCP


