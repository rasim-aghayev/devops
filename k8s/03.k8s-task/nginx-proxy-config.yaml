apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-proxy-config
  namespace: red
data:
  default.conf: |
    server {
      listen 80;

      location / {
        proxy_pass http://nexus.blue.svc.cluster.local:8081;

        proxy_set_header Host nexus.blue.svc.cluster.local;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
    }




